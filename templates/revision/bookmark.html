{% if authenticated %}
<form method="post" class="revision-bookmark-control" action="{% if is_saved %}{% url 'revision:unsave' question_id %}{% else %}{% url 'revision:save' question_id %}{% endif %}"
      data-bookmark-form data-question-id="{{ question_id }}"
      data-save-url="{% url 'revision:save' question_id %}" data-unsave-url="{% url 'revision:unsave' question_id %}">
  {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="revision-bookmark-button" aria-pressed="{{ is_saved|yesno:'true,false' }}"
          aria-label="{% if is_saved %}Remove from revision bank{% else %}Save for revision{% endif %}"
          title="{% if is_saved %}Remove from revision bank{% else %}Save for revision{% endif %}" data-bookmark-button>
    <span class="revision-bookmark-check" aria-hidden="true">{% include "components/icon.html" with name="check" %}</span><span data-bookmark-label>{% if is_saved %}Saved for revision{% else %}Save for revision{% endif %}</span>
  </button>
  <span class="visually-hidden" role="status" aria-live="polite" data-bookmark-status></span>
  <a href="{{ login_url }}" data-bookmark-login hidden>Sign in to save</a>
</form>
{% else %}<a class="revision-bookmark-control revision-bookmark-button" href="{{ login_url }}" aria-label="Sign in to save for revision" title="Sign in to save for revision"><span class="revision-bookmark-check" aria-hidden="true">{% include "components/icon.html" with name="check" %}</span><span>Save for revision</span></a>{% endif %}
