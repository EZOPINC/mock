{% if paper_form %}
<form method="get" action="{% url 'previous_year:paper_year' exam.authority.slug exam.slug year %}" class="stage-panel general-filters ui-filter-panel">
  {% if selected_stage %}<input type="hidden" name="stage" value="{{ selected_stage }}">{% endif %}
  {% if selected_session != None %}<input type="hidden" name="session" value="{{ selected_session }}">{% endif %}
  {% if viewer_mode %}<input type="hidden" name="mode" value="{{ viewer_mode }}">{% endif %}
  {{ paper_form.paper.label_tag }}{{ paper_form.paper }}{{ paper_form.paper.errors }}
  <button type="submit">View Questions</button>
</form>
{% endif %}
