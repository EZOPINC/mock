<div class="practice-performance-grid">{% for item in performance_items %}<article class="practice-performance-card"><h3>{{ item.name }}</h3><p class="practice-performance-accuracy">{{ item.accuracy }}% <span>accuracy</span></p><ul><li>{{ item.correct }} correct</li><li>{{ item.incorrect }} incorrect</li><li>{{ item.remaining }} remaining</li></ul><progress max="{{ item.total }}" value="{{ item.answered }}" aria-label="{{ item.name }} answer progress">{{ item.percent }}%</progress></article>{% empty %}<p class="muted">No performance information is available yet.</p>{% endfor %}</div>
