<section class="stage-panel practice-progress-card" aria-label="Practice progress">
<div class="practice-progress-heading"><h2>Your progress</h2><span class="badge badge-outline">Accuracy: {{ progress.accuracy }}%</span></div>
<div class="practice-progress-stats"><p><span>Total:</span><strong>{{ progress.total }}</strong></p><p><span>Answered:</span><strong>{{ progress.answered }}</strong></p><p class="practice-stat-correct"><span>Correct:</span><strong>{{ progress.correct }}</strong></p><p class="practice-stat-incorrect"><span>Incorrect:</span><strong>{{ progress.incorrect }}</strong></p><p><span>Remaining:</span><strong>{{ progress.remaining }}</strong></p></div>
<div class="practice-progress-label"><label for="practice-progress">Session progress</label><span>Progress: {{ progress.percent }}%</span></div><progress id="practice-progress" max="{{ progress.total }}" value="{{ progress.answered }}">{{ progress.percent }}%</progress>
</section>
