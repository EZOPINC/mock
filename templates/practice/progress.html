<section class="stage-panel" aria-label="Practice progress"><p>Total: {{ progress.total }} &middot; Answered: {{ progress.answered }} &middot; Correct: {{ progress.correct }} &middot; Incorrect: {{ progress.incorrect }} &middot; Remaining: {{ progress.remaining }}</p><p>Accuracy: {{ progress.accuracy }}% &middot; Progress: {{ progress.percent }}%</p><label for="practice-progress">Session progress</label><progress id="practice-progress" max="{{ progress.total }}" value="{{ progress.answered }}">{{ progress.percent }}%</progress></section>
