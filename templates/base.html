{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore competitive exam papers, questions and solutions in English and Bengali. Prepare at your own pace with Mock Exam Platform.">
  <title>{% block title %}Mock Exam Platform{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  {% block extra_head %}{% endblock %}
  <script src="{% static 'js/navigation.js' %}" defer></script>
  <script src="{% static 'js/student.js' %}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include "components/header.html" %}
  <main id="main-content" tabindex="-1">
    {% include "components/messages.html" %}
    {% block content %}{% endblock %}
  </main>
  {% include "components/footer.html" %}
</body>
</html>
